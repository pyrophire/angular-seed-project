<h1 mat-dialog-title>{{ data.title || 'Confirm' }}</h1>
<div
    mat-dialog-content
    class="confirm-message">
    {{ data.message }}
</div>
<div mat-dialog-actions>
    <div flex></div>
    <button
        matButton="outlined"
        class="cancel-button"
        (click)="close()">
        Cancel
    </button>
    <button
        matButton="filled"
        class="ok-button"
        (click)="ok()"
        cdkFocusInitial>
        Ok
    </button>
</div>
